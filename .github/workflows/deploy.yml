name: Deploy
run-name: Deploy by ${{ github.actor }}
on: 
    workflow_dispatch:
jobs:
  Init:
    name: Init
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
    

      - name: Terraform Init
        working-directory: examples/EKSexamples
        run: terraform init  
  plan:
    name: Plan
    needs: Init
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Init
        working-directory: examples/EKSexamples
        run: terraform init     
        
      - name: Write tfvars
        working-directory: examples/EKSexamples    
        env: 
         TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}
        run: |
             printf "%s" "$TFVARS_CONTENT" > terraform.tfvars    


      - name: Terraform Debug
        working-directory: examples/EKSexamples
        run: |
         echo "=== Terraform Version ==="
         terraform version

         echo "=== Current Directory ==="
         pwd

         echo "=== Files ==="
         ls -lah

         echo "=== Terraform Workspace ==="
         terraform workspace show


         echo "=== AWS Identity ==="
         aws sts get-caller-identity

         echo "=== AWS Region ==="
         echo "$AWS_REGION"

      - name: Terraform Plan
        working-directory: examples/EKSexamples
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt
          cat plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: examples/EKSexamples/tfplan

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          ref: dev

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7
      
      - name: Terraform Init
        working-directory: examples/EKSexamples
        run: terraform init    

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: examples/EKSexamples


      - name: Terraform Apply
        working-directory: examples/EKSexamples
        run: terraform apply -auto-approve tfplan