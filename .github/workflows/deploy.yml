name: Terraform Deployment
run-name: Deploy by ${{ github.actor }} on ${{ github.ref_name }}
on: 
    workflow_dispatch:
jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
  
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5

      - name: Terraform Init
        working-directory: examples/EKSexamples
        run: terraform init    

      - name: Write tfvars
        working-directory: examples/EKSexamples    
        env: 
         TFVARS_CONTENT: ${{ secrets.TFVARS_CONTENT }}
        run: |
             printf "%s" "$TFVARS_CONTENT" > terraform.tfvars     
        
      - name: Terraform Format
        working-directory: examples/EKSexamples
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: examples/EKSexamples
        run: terraform validate

     


      - name: Terraform Debug
        working-directory: examples/EKSexamples
        run: |
         echo "=== Terraform Version ==="
         terraform version

         echo "=== Current Directory ==="
         pwd

         echo "=== Files ==="
         ls -lah

         echo "=== Terraform Workspace ==="
         terraform workspace show



         echo "=== AWS Region ==="
         echo "$AWS_REGION"

      - name: Terraform Plan
        working-directory: examples/EKSexamples
        run: |
          terraform plan -out=tfplan
          terraform show -no-color tfplan > plan.txt
         # cat plan.txt

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: |
            examples/EKSexamples/tfplan
            examples/EKSexamples/plan.txt
          if-no-files-found: error
          retention-days: 5  

  apply:
    name: Apply
    runs-on: ubuntu-latest
    needs: plan
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5
      
      - name: Terraform Init
        working-directory: examples/EKSexamples
        run: terraform init    

      - name: Download plan artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ github.sha }}
          path: examples/EKSexamples

      - name: Verify Terraform Plan
        working-directory: examples/EKSexamples
        run: |
         test -f tfplan || (echo "Terraform plan file not found!" && exit 1)
         ls -lah tfplan    


      - name: Terraform Apply
        working-directory: examples/EKSexamples
        run: terraform apply -auto-approve tfplan